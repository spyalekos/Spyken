[project]
name = "spyken"
version = "1.7.0"
description = "Flet application for synced audio and video marquee generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet",
    "edge-tts>=7.3.1",
    "python-docx",
    "pymupdf",
    "moviepy",
    "mutagen",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
]

[dependency-groups]
dev = [
    "pyinstaller",
]
